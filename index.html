<!DOCTYPE html>
<html>
  <head>
    <title>HummingbirdZ Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; }
      #map { height: 100%; width: 100%; }
    </style>

    <!-- 1. Define initMap & gotGeoJson *first*, on the window object -->
    <script>
      let map;

      // Called by the Maps API once it loads
      window.initMap = function() {
        map = new google.maps.Map(
          document.getElementById("map"),
          {
            center: { lat: 50.721, lng: -3.531 },
            zoom: 10,
            mapTypeId: "roadmap"
          }
        );

        // Inject your Apps Script URL as a JSONP <script> tag
        const jsonp = document.createElement("script");
        jsonp.src =
          "https://script.google.com/macros/s/AKfycbwocJBbSUgMMIos8S443mdkP4ukY6cemJ9m-vAz9spu/exec"
          + "?callback=gotGeoJson";
        document.body.appendChild(jsonp);
      };

      // Called by your Apps Script JSONP response
      window.gotGeoJson = function(collection) {
        collection.features.forEach(feature => {
          const [lng, lat] = feature.geometry.coordinates;
          new google.maps.Marker({
            position: { lat, lng },
            map: map
          });
        });
      };
    </script>

    <!-- 2. Now load the Maps API; it will call initMap when ready -->
    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD-RylSa34BE858N-s7VGpRSYW0gOj0at8&callback=initMap"
      defer
    ></script>
  </head>

  <body>
    <div id="map"></div>
  </body>
</html>
