<!DOCTYPE html>
<html>
  <head>
    <title>Simple Map Pin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; }
      #map { height: 100%; width: 100%; }
    </style>
    <script>
      function initMap() {
        // Center map on the location you want
        const location = { lat: 50.7208226, lng: -3.5511166 };

        const map = new google.maps.Map(document.getElementById("map"), {
          zoom: 15,
          center: location
        });

        // Add a default marker
        new google.maps.Marker({
          position: location,
          map: map
        });
      }
    </script>
    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD-RylSa34BE858N-s7VGpRSYW0gOj0at8&callback=initMap"
      async
      defer
    ></script>
  </head>
  <body>
    <div id="map"></div>
  </body>
</html>
