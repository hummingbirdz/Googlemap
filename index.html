<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>HummingbirdZ Admin Map</title>
  <!-- Material Symbols (outlined, filled via CSS below) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
  <style>
    #map {
      height: 100vh;
      width: 100%;
    }

    .material-symbols-outlined {
      font-variation-settings:
        'FILL' 1,
        'wght' 400,
        'GRAD' 0,
        'opsz' 32;
      font-size: 36px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: inherit;
    }
  </style>

  <!-- Load Maps JS API with marker library -->
  <script async
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD-RylSa34BE858N-s7VGpRSYW0gOj0at8&libraries=marker">
  </script>
</head>
<body>
  <div id="map"></div>

  <script>
    async function initMap() {
      // Create map
      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 50.7398825, lng: -3.5009917 },
        zoom: 13,
        mapId: '67b6ebd01839b65816f4222e'
      });

      const markers = {};
      let lastJobIds = new Set();

      async function fetchNewJobs() {
        try {
          const response = await fetch("https://script.google.com/macros/s/AKfycbzjI8mmj3hNgMgAsaRq_gPfZkddGb2SBR3zXgVNyDT6CUL4eY_e9N3iweSj60bQ4D6W7Q/exec");
          const geojson = await response.json();

          geojson.features.forEach(feature => {
            const id = feature.properties.address || `${feature.geometry.coordinates[1]},${feature.geometry.coordinates[0]}`;
            if (lastJobIds.has(id)) return;

            const iconName = feature.properties.icon?.toLowerCase() || "place";
            const color = feature.properties.companyColor || "#000000";

            const el = document.createElement("span");
            el.className = "material-symbols-outlined";
            el.style.color = color;
            el.textContent = iconName;

            const marker = new google.maps.marker.AdvancedMarkerElement({
              map,
              position: {
                lat: parseFloat(feature.geometry.coordinates[1]),
                lng: parseFloat(feature.geometry.coordinates[0])
              },
              content: el
            });

            markers[id] = marker;
            lastJobIds.add(id);
          });
        } catch (e) {
          console.error("Failed to fetch jobs:", e);
        }
      }

      fetchNewJobs();
      setInterval(fetchNewJobs, 3000);
    }

    window.initMap = initMap;
  </script>

  <!-- Initialize callback -->
  <script async
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD-RylSa34BE858N-s7VGpRSYW0gOj0at8&callback=initMap&libraries=marker">
  </script>
</body>
</html>
