<!DOCTYPE html>
<html>
  <head>
    <title>HummingbirdZ Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; }
      #map { height: 100%; width: 100%; }
    </style>
    <!-- 1. Load the Maps API (with callback=initMap) -->
    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD-RylSa34BE858N-s7VGpRSYW0gOj0at8&callback=initMap"
      async
      defer
    ></script>
  </head>
  <body>
    <div id="map"></div>
    <script>
      let map;

      // 2. Called by the Maps API once ready
      function initMap() {
        map = new google.maps.Map(
          document.getElementById("map"),
          { center: { lat: 50.721, lng: -3.531 }, zoom: 10 }
        );

        // 3. Inject Apps-Script as JSONP
        const s = document.createElement("script");
        s.src = 
          "https://script.google.com/macros/s/AKfycbwocJBbSUgMMIos8S443mdkP4ukY6cemJ9m-vAz9spu/exec"
          + "?callback=gotGeoJson";
        document.body.appendChild(s);
      }

      // 4. Your JSONP callback drops the pin(s)
      function gotGeoJson(collection) {
        collection.features.forEach(f => {
          const [lng, lat] = f.geometry.coordinates;
          new google.maps.Marker({
            position: { lat, lng },
            map: map
          });
        });
      }
    </script>
  </body>
</html>
