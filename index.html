<!DOCTYPE html>
<html>
<head>
  <title>HummingbirdZ Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #map { height: 100%; width: 100%; }
  </style>
  <script>
    let map;
    let markers = {}; // store markers by unique ID

    async function initMap() {
      const { Map } = await google.maps.importLibrary("maps");
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      map = new Map(document.getElementById("map"), {
        center: { lat: 50.721, lng: -3.531 },
        zoom: 10,
        mapId: '67b6ebd01839b65816f4222e' // your custom map style
      });

      // load initial markers
      loadMarkers(AdvancedMarkerElement);

      // optional: poll for new jobs every 10 seconds
      setInterval(() => loadMarkers(AdvancedMarkerElement), 10000);
    }

    function loadMarkers(AdvancedMarkerElement) {
      const jsonp = document.createElement("script");
      jsonp.src = "https://script.google.com/macros/s/AKfycbzjI8mmj3hNgMgAsaRq_gPfZkddGb2SBR3zXgVNyDT6CUL4eY_e9N3iweSj60bQ4D6W7Q/exec?callback=gotGeoJson";
      jsonp.defer = true;
      jsonp.async = true;
      document.body.appendChild(jsonp);

      window.gotGeoJson = function(collection) {
        collection.features.forEach(f => {
          const id = f.geometry.coordinates.join(",") + "|" + (f.properties.address || "");
          if (!markers[id]) {
            const [lng, lat] = f.geometry.coordinates;

            // create the advanced marker
            const marker = new AdvancedMarkerElement({
              map,
              position: { lat, lng },
              title: f.properties.address || "Job"
            });

            markers[id] = marker;
          }
        });
      };
    }
  </script>

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD-RylSa34BE858N-s7VGpRSYW0gOj0at8&callback=initMap&v=beta" async defer></script>
</head>
<body>
  <div id="map"></div>
</body>
</html>
