<!DOCTYPE html>
<html>
  <head>
    <title>HummingbirdZ Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; }
      #map { height: 100%; width: 100%; }
    </style>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCcVltNMDHfrOfK9wzihcYa_Owyp7WvuVo"></script>
  </head>
  <body>
    <div id="map"></div>
    <script>
      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 50.721, lng: -3.531 }, // Exeter area
        zoom: 10,
        mapTypeId: "roadmap"
      });
    </script>
  </body>
</html>
