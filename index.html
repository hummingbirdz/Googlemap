<!DOCTYPE html>
<html>
  <head>
    <title>HummingbirdZ Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; }
      #map { height: 100%; width: 100%; }
    </style>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD-RylSa34BE858N-s7VGpRSYW0gOj0at8"></script>
  </head>
  <body>
    <div id="map"></div>
    <script>
      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 50.721, lng: -3.531 }, // Exeter area
        zoom: 10,
        mapTypeId: "roadmap"
      });

      // Load GeoJSON from your Apps Script
      fetch("https://script.google.com/macros/s/AKfycbwocJBbSUgMMIos8S443mdkP4ukY6cemJ9m-vAz9spu/dev")
        .then(response => response.json())
        .then(data => {
          map.data.addGeoJson(data);
        })
        .catch(error => {
          console.error("Failed to load GeoJSON:", error);
        });
    </script>
  </body>
</html>
