<!DOCTYPE html>
<html>
  <head>
    <title>HummingbirdZ Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; }
      #map { height: 100%; width: 100%; }
    </style>

    <script>
      // Callback for GeoJSON data
      function gotGeoJson(collection) {
        console.log("Got GeoJSON:", collection);

        collection.features.forEach(f => {
          const [lng, lat] = f.geometry.coordinates; // GeoJSON order
          new google.maps.Marker({
            position: { lat: Number(lat), lng: Number(lng) },
            map: window.map
          });
        });
      }

      // Init the Google Map
      function initMap() {
        window.map = new google.maps.Map(
          document.getElementById("map"),
          {
            center: { lat: 50.721, lng: -3.531 }, // Exeter area
            zoom: 12
          }
        );

        // Load GeoJSON from Apps Script via JSONP
        const jsonp = document.createElement("script");
        jsonp.src =
          "https://script.google.com/macros/s/AKfycbwocJBbSUgMMIos8S443mdkP4ukY6cemJ9m-vAz9spu/exec"
          + "?callback=gotGeoJson";
        document.body.appendChild(jsonp);
      }
    </script>

    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD-RylSa34BE858N-s7VGpRSYW0gOj0at8&callback=initMap&loading=async"
      async
      defer
    ></script>
  </head>
  <body>
    <div id="map"></div>
  </body>
</html>
