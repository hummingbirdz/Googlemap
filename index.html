<!DOCTYPE html>
<html>
  <head>
    <title>HummingbirdZ Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; }
      #map { height: 100%; width: 100%; }
    </style>

    <!-- 1. Define both callbacks before loading any external scripts -->
    <script>
      // Called by your Apps Script JSONP response
      function gotGeoJson(collection) {
        collection.features.forEach(f => {
          const [lng, lat] = f.geometry.coordinates;
          new google.maps.Marker({
            position: { lat, lng },
            map: window.map
          });
        });
      }

      // Called by the Maps API once it loads
      function initMap() {
        // a) Create the map and stash it globally
        window.map = new google.maps.Map(
          document.getElementById("map"),
          {
            center: { lat: 50.721, lng: -3.531 },
            zoom: 10,
            mapTypeId: "roadmap"
          }
        );

        // b) Inject your Apps Script URL as a JSONP <script>
        const jsonp = document.createElement("script");
        jsonp.src =
          "https://script.google.com/macros/s/AKfycbwocJBbSUgMMIos8S443mdkP4ukY6cemJ9m-vAz9spu/exec"
          + "?callback=gotGeoJson";
        document.body.appendChild(jsonp);
      }
    </script>

    <!-- 2. Load the Maps API, telling it to call initMap when ready -->
    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD-RylSa34BE858N-s7VGpRSYW0gOj0at8&callback=initMap"
      async
      defer
    ></script>
  </head>

  <body>
    <div id="map"></div>
  </body>
</html>
