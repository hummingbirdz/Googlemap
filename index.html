<!DOCTYPE html>
<html>
<head>
  <title>HummingbirdZ Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #map { height: 100%; width: 100%; }
  </style>

  <script>
    function gotGeoJson(collection) {
      console.log("Got GeoJSON:", collection);

      collection.features.forEach(f => {
        const [lng, lat] = f.geometry.coordinates.map(Number);

        new google.maps.marker.AdvancedMarkerElement({
          map: window.map,
          position: { lat, lng }
        });
      });
    }

    function initMap() {
      window.map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 50.721, lng: -3.531 },
        zoom: 12
      });

      const jsonp = document.createElement("script");
      jsonp.src =
        "https://script.google.com/macros/s/AKfycbzWPKe_mL0LFjono0hAPa28GHUvdXNJYnP2TEwrooFU79-qYj7Ynei-DpX0saZ4p9cB_Q/exec"
        + "?callback=gotGeoJson";
      document.body.appendChild(jsonp);
    }
  </script>

  <!-- Note the libraries=marker -->
  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD-RylSa34BE858N-s7VGpRSYW0gOj0at8&callback=initMap&libraries=marker&loading=async"
    async
    defer
  ></script>
</head>

<body>
  <div id="map"></div>
</body>
</html>
