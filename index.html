<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>HummingbirdZ Admin Map</title>

  <!-- Material Symbols filled (opsz 24) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />

  <style>
    #map { height: 100vh; width: 100%; }

    .material-symbols-outlined {
      font-variation-settings:
        'FILL' 1,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24;
      font-size: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: inherit;
      -webkit-text-stroke: 0.60px #222; /* thin dark outline */
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    async function initMap() {
      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 50.7398825, lng: -3.5009917 }, // Exeter
        zoom: 13,
        mapId: '67b6ebd01839b658df609c00' // NEW Admin Map ID
      });

      const markers = {};
      const lastJobIds = new Set();

      // Create a single info window to reuse for all markers
      const infoWindow = new google.maps.InfoWindow();

      async function fetchNewJobs() {
        try {
          const res = await fetch("https://script.google.com/macros/s/AKfycbzjI8mmj3hNgMgAsaRq_gPfZkddGb2SBR3zXgVNyDT6CUL4eY_e9N3iweSj60bQ4D6W7Q/exec");
          const geojson = await res.json();

          geojson.features.forEach(feature => {
            const id = feature.properties.address || `${feature.geometry.coordinates[1]},${feature.geometry.coordinates[0]}`;
            if (lastJobIds.has(id)) return;

            const iconName = feature.properties.icon || "place";
            const color = feature.properties.companyColor || "#000000";

            const el = document.createElement("span");
            el.className = "material-symbols-outlined";
            el.style.color = color;
            el.textContent = iconName;

            const position = {
              lat: parseFloat(feature.geometry.coordinates[1]),
              lng: parseFloat(feature.geometry.coordinates[0])
            };

            const marker = new google.maps.marker.AdvancedMarkerElement({
              map,
              position,
              content: el
            });

            // Add click listener to open info window
            marker.addListener("click", () => {
              const content = `
                <div style="font-family: Arial, sans-serif; font-size: 14px;">
                  <strong>${feature.properties.companyName}</strong><br>
                  ${feature.properties.address}<br>
                  <em>${feature.properties.jobType}</em>
                </div>
              `;
              infoWindow.setContent(content);
              infoWindow.open(map, marker);
            });

            markers[id] = marker;
            lastJobIds.add(id);
          });
        } catch (err) {
          console.error("Failed to fetch jobs:", err);
        }
      }

      fetchNewJobs();
      setInterval(fetchNewJobs, 3000);
    }

    window.initMap = initMap;
  </script>

  <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD-RylSa34BE858N-s7VGpRSYW0gOj0at8&callback=initMap&libraries=marker"></script>
</body>
</html>
