<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Google Maps Dynamic Markers</title>
  <!-- Load the filled Material Symbols font -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Filled">
  <style>
    #map { height: 100vh; width: 100%; }
    .material-icon-marker {
      font-family: 'Material Symbols Filled';
      font-variation-settings: 'FILL' 1;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px; /* keep same size as before */
    }
  </style>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD-RylSa34BE858N-s7VGpRSYW0gOj0at8&libraries=marker"></script>
</head>
<body>
  <div id="map"></div>
  <script>
    const map = new google.maps.Map(document.getElementById("map"), {
      center: { lat: 50.7398825, lng: -3.5009917 }, // initial center on Exeter
      zoom: 13,
      mapId: '67b6ebd01839b65816f4222e'
    });

    const markers = {};
    let lastJobIds = new Set();

    async function fetchNewJobs() {
      try {
        const response = await fetch("https://script.google.com/macros/s/AKfycbzjI8mmj3hNgMgAsaRq_gPfZkddGb2SBR3zXgVNyDT6CUL4eY_e9N3iweSj60bQ4D6W7Q/exec");
        const geojson = await response.json();

        geojson.features.forEach(feature => {
          const id = feature.properties.address || feature.properties.lat + ',' + feature.properties.lng;
          if (lastJobIds.has(id)) return; // skip already-added marker

          const iconName = feature.properties.icon || "place";
          const color = feature.properties.companyColor || "#000000";

          const el = document.createElement("div");
          el.className = "material-icon-marker";
          el.style.color = color;
          el.textContent = iconName; // keep as textContent for ligature to render

          const marker = new google.maps.marker.AdvancedMarkerElement({
            map,
            position: {
              lat: parseFloat(feature.geometry.coordinates[1]),
              lng: parseFloat(feature.geometry.coordinates[0])
            },
            content: el
          });

          markers[id] = marker;
          lastJobIds.add(id);
        });
      } catch (e) {
        console.error("Failed to fetch jobs:", e);
      }
    }

    // Initial load
    fetchNewJobs();

    // Poll every 3 seconds for new jobs
    setInterval(fetchNewJobs, 3000);
  </script>
</body>
</html>
